# Production setup: Caddy terminates HTTPS, the app is not reachable directly.
# Copy .env.example to .env on the server and set DOMAIN before starting.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/financecockpit.db
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    volumes:
      - app-data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
